name: Validate baseline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - run: python scripts/validate.py
      - run: python scripts/render.py --check
      - run: python -m unittest discover -s tests -v
      - run: python scripts/assess.py examples/answers.example.json > /tmp/assessment-report.json
      - run: python pilots/PILOT-001/run_pilot.py --check
      - run: python pilots/EVIDENCE-001/run_evidence_pilot.py --check
      - run: python pilots/INPUT-001/run_input_pilot.py --check
      - run: python pilots/VERIFICATION-001/run_verification_pilot.py --check
      - run: python pilots/PILOT-002/run_pilot.py --check
      - run: git diff --check
